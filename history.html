<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Quality - History</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --text-muted: #475569; --border: #cbd5e1; --accent-blue: #2563eb; }
        body, .page-wrap { background: var(--bg) !important; color: var(--text) !important; }
        
        .page-header h1, .page-header p, h1, h2, h3, p, label { color: var(--text); }
        .page-header p { color: var(--text-muted) !important; }

        .topbar { background: var(--card) !important; border-bottom: 1px solid var(--border); }
        .topbar-brand, .topbar-menu a { color: var(--text) !important; }
        .topbar-menu a.active { background: var(--accent-blue) !important; color: white !important; }
        
        .glass-card { background: var(--card) !important; border: 1px solid var(--border) !important; box-shadow: 0 4px 6px rgba(0,0,0,0.05) !important; }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 15px; color: var(--text) !important; font-size: 13px; }
        .data-table th, .data-table td { padding: 10px; border-bottom: 1px solid var(--border); text-align: center; }
        .data-table th { background: #e2e8f0 !important; color: var(--text) !important; font-weight: bold; }
        .data-table tr:hover { background: #f1f5f9 !important; }
        
        .date-input { padding: 10px 15px; border-radius: 6px; background: #ffffff !important; color: var(--text) !important; border: 1px solid var(--border) !important; outline: none; cursor: pointer; font-family: inherit; width: 100%;}
        .form-group { text-align: left; margin-bottom: 15px; flex: 1; min-width: 180px;}
        .form-label { display: block; color: var(--accent-blue) !important; font-weight: bold; margin-bottom: 8px; font-size: 14px;}
        .section-title { font-weight:bold; color: var(--text) !important; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-brand"><i class="fa-solid fa-leaf"></i> AIR QUALITY</div>
        <div class="topbar-menu">
            <a href="index.html">Dashboard</a>
            <a href="speedometer.html">Speedometer</a>
            <a href="grafik.html">Grafik</a>
            <a href="history.html" class="active">History</a>
        </div>
    </div>

    <div class="page-wrap">
        <div class="page-header">
            <div>
                <h1><i class="fa-solid fa-file-export"></i> Filter & Export Data Penelitian</h1>
                <p>Tampilkan dan unduh data KTI berdasarkan parameter dan rentang waktu spesifik.</p>
            </div>
        </div>

        <div class="glass-card" style="margin-bottom: 20px; border: 1px solid var(--border);">
            <div class="section-title" style="color: var(--accent-blue) !important; margin-bottom: 20px; font-size: 18px; text-align: center;">
                <i class="fa-solid fa-sliders"></i> Parameter Filter Data
            </div>
            
            <div style="display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-start; justify-content: space-between; background: #f8fafc; padding: 20px; border-radius: 8px; border:1px solid var(--border);">
                
                <div class="form-group">
                    <label class="form-label"><i class="fa-solid fa-calendar-plus"></i> Waktu Mulai:</label>
                    <input type="datetime-local" id="hist-start" class="date-input">
                </div>

                <div class="form-group">
                    <label class="form-label"><i class="fa-solid fa-calendar-check"></i> Waktu Selesai:</label>
                    <input type="datetime-local" id="hist-end" class="date-input">
                </div>

                <div class="form-group">
                    <label class="form-label"><i class="fa-solid fa-chart-pie"></i> Parameter Sensor:</label>
                    <select id="hist-sensor" class="date-input">
                        <option value="all">Tampilkan Semua Data</option>
                        <option value="suhu">Khusus Suhu (°C)</option>
                        <option value="hum">Khusus Kelembaban (%)</option>
                        <option value="pm1">Khusus PM 1.0 (µg/m³)</option>
                        <option value="co">Khusus CO (µg/m³)</option>
                        <option value="pm25">Khusus PM 2.5 (µg/m³)</option>
                        <option value="pm10">Khusus PM 10 (µg/m³)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label"><i class="fa-solid fa-filter"></i> Metode Olah Data:</label>
                    <select id="hist-format" class="date-input">
                        <option value="raw">1. Realtime / Data Mentah Asli</option>
                        <option value="hourly">2. Rata-rata per Jam</option>
                        <option value="daily">3. Rata-rata 24 Jam (Harian)</option>
                    </select>
                </div>
            </div>

            <div style="text-align: center; margin-top: 25px; padding-bottom: 10px; display: flex; justify-content: center; gap: 15px;">
                <button onclick="processHistoryView()" style="background: var(--accent-blue); color: white !important; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px;">
                    <i class="fa-solid fa-eye"></i> Tampilkan di Layar
                </button>
                <button onclick="processDownload()" style="background: #10b981; color: white !important; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px;">
                    <i class="fa-solid fa-file-excel"></i> Unduh Excel
                </button>
            </div>
        </div>

        <div class="glass-card" style="overflow-x:auto;">
            <div class="section-title" style="padding:15px; border-bottom:none;"><i class="fa-solid fa-table"></i> Tabel Riwayat Data</div>
            <table class="data-table" id="dataTable">
                <thead id="table-head">
                    </thead>
                <tbody id="history-table-body">
                    <tr><td colspan="100%">Silakan atur filter dan klik "Tampilkan di Layar".</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
</body>
</html>
