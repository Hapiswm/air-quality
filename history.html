<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Nano Banana V2 - History</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #f0f4f8; --card: #ffffff; --txt: #1e293b; --txt-muted: #64748b; --shadow-dark: rgba(148,163,184,0.2); }
        body { background: var(--bg); color: var(--txt); font-family: sans-serif; padding: 20px; margin: 0; }
        .navbar { display: flex; justify-content: space-between; padding: 15px 30px; background: var(--card); border-radius: 15px; box-shadow: 5px 5px 15px var(--shadow-dark); margin-bottom: 20px; align-items: center;}
        .nav-brand { color: #2563eb; font-size: 24px; font-weight: bold; }
        .nav-links a { color: var(--txt-muted); text-decoration: none; padding: 10px 20px; border-radius: 10px; font-weight: 600; margin-left: 10px; }
        .nav-links a.active { color: #ffffff; background: #2563eb; }
        .controls { display: flex; gap: 15px; background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 20px; box-shadow: 5px 5px 15px var(--shadow-dark); align-items: center;}
        select, input[type="date"], button { padding: 8px 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; }
        .btn-cari { background: #2563eb; color: white; border: none; cursor: pointer; font-weight: bold; }
        .btn-excel { background: #16a34a; color: white; border: none; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; min-width: 1200px; background: var(--card); border-radius: 10px; overflow: hidden; box-shadow: 5px 5px 15px var(--shadow-dark);}
        th, td { padding: 8px; text-align: center; border-bottom: 1px solid #e2e8f0; font-size: 13px; }
        th { background: #f8fafc; color: #0f172a; border-bottom: 2px solid #cbd5e1; }
        .th-group { background: #e2e8f0; font-weight: bold; border-left: 2px solid #cbd5e1; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand"><i class="fas fa-leaf"></i> NANO BANANA V2</div>
        <div class="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="speedometer.html">Speedometer</a>
            <a href="grafik.html">Grafik</a>
            <a href="history.html" class="active">History</a>
        </div>
    </nav>

    <div class="controls">
        <strong>Filter Tabel & Excel:</strong>
        <select id="hist-mode">
            <option value="raw">Data Mentah (Per Data Masuk)</option>
            <option value="perjam">Rata-rata Per Jam</option>
            <option value="24jam">Rata-rata 24 Jam</option>
        </select>
        <input type="date" id="hist-date">
        <button class="btn-cari" onclick="loadHistoryData()"><i class="fas fa-search"></i> Tampilkan</button>
        <button class="btn-excel" onclick="exportToCSV()"><i class="fas fa-file-excel"></i> Download Sesuai Filter</button>
    </div>

    <div style="overflow-x: auto;">
        <table id="dataTable">
            <thead>
                <tr>
                    <th rowspan="2">Waktu / Rentang</th>
                    <th colspan="6" class="th-group">RECEIVER (INDOOR)</th>
                    <th colspan="6" class="th-group">SENDER (OUTDOOR)</th>
                </tr>
                <tr>
                    <th class="th-group">Suhu</th><th>Hum</th><th>NO2</th><th>CO</th><th>PM2.5</th><th>PM10</th>
                    <th class="th-group">Suhu</th><th>Hum</th><th>NO2</th><th>CO</th><th>PM2.5</th><th>PM10</th>
                </tr>
            </thead>
            <tbody id="tableBody"><tr><td colspan="13">Silakan pilih tanggal dan klik Tampilkan</td></tr></tbody>
        </table>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="app.js"></script>
</body>
</html>
