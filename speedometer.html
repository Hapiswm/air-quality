<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Quality - Speedometer</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        /* PERBAIKAN TEMA PUTIH & TEKS GELAP */
        :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --text-muted: #475569; --border: #cbd5e1; --accent-blue: #2563eb; }
        body, .page-wrap { background: var(--bg) !important; color: var(--text) !important; }
        
        .page-header h1, .page-header p, h1, h2, h3, p { color: var(--text) !important; }
        .page-header p { color: var(--text-muted) !important; }

        .topbar { background: var(--card) !important; border-bottom: 1px solid var(--border); }
        .topbar-brand, .topbar-menu a { color: var(--text) !important; }
        .topbar-menu a.active { background: var(--accent-blue) !important; color: white !important; }
        
        .weather-panel { display: flex; justify-content: space-around; background: var(--card) !important; padding: 15px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); align-items: center;}
        .w-item { text-align: center; flex: 1; }
        .w-val { font-size: 24px; font-weight: bold; color: var(--accent-blue) !important; margin-top: 5px;}
        .w-lbl { font-size: 13px; font-weight: bold; color: var(--text-muted) !important; text-transform: uppercase; }
        .w-divider { border-left: 2px solid var(--border); }
        
        .section-title { color: var(--accent-blue) !important; margin-top: 20px; font-weight:bold; border-bottom:2px solid var(--border); padding-bottom:5px; }

        .speedo-card { text-align: center; padding: 25px 15px; background: var(--card) !important; border-radius: 16px; border: 1px solid var(--border) !important; box-shadow: 0 4px 6px rgba(0,0,0,0.05) !important; }
        .speedo-title { font-weight: 800; margin-bottom: 15px; color: var(--text) !important; font-size: 15px; }
        .speedo-container { position: relative; width: 100%; max-width: 260px; margin: 0 auto; }
        .speedo-svg { width: 100%; display: block; overflow: visible; }
        .speedo-val-wrap { margin-top: -15px; display: flex; flex-direction: column; align-items: center; min-height: 80px; }
        .speedo-val { font-size: 40px; font-weight: 900; color: var(--text) !important; font-family: 'Segoe UI', sans-serif; letter-spacing: -1px; margin-bottom: 5px; }
        .speedo-stat { font-size: 14px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
        .speedo-needle { transform-origin: 120px 120px; transition: transform 1.5s cubic-bezier(0.17, 0.67, 0.83, 0.67); }
        .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-brand"><i class="fa-solid fa-leaf"></i> AIR QUALITY</div>
        <div class="topbar-menu">
            <a href="index.html">Dashboard</a>
            <a href="speedometer.html" class="active">Speedometer</a>
            <a href="grafik.html">Grafik</a>
            <a href="history.html">History</a>
        </div>
    </div>
    
    <div class="page-wrap">
        <div class="page-header" style="text-align: center;">
            <h1><i class="fa-solid fa-gauge-high"></i> Indikator Speedometer</h1>
            <p>Visualisasi presisi gaya meteran sesuai standar ISPU (0 - 500).</p>
        </div>

        <div class="weather-panel">
            <div class="w-item"><div class="w-lbl"><i class="fa-solid fa-temperature-half"></i> Suhu Receiver</div><div class="w-val" id="val-suhu-recv-spd">0.0 °C</div></div>
            <div class="w-item"><div class="w-lbl"><i class="fa-solid fa-droplet"></i> Hum Receiver</div><div class="w-val" id="val-hum-recv-spd">0.0 %</div></div>
            <div class="w-item w-divider"><div class="w-lbl"><i class="fa-solid fa-temperature-half"></i> Suhu Sender</div><div class="w-val" id="val-suhu-send-spd">0.0 °C</div></div>
            <div class="w-item"><div class="w-lbl"><i class="fa-solid fa-droplet"></i> Hum Sender</div><div class="w-val" id="val-hum-send-spd">0.0 %</div></div>
        </div>

        <div class="section-title"><i class="fa-solid fa-microchip"></i> Area Node Receiver</div>
        <div class="grid-4" id="grid-recv"></div>
        
        <div class="section-title" style="margin-top: 30px;"><i class="fa-solid fa-satellite-dish"></i> Area Node Sender</div>
        <div class="grid-4" id="grid-send"></div>
    </div>
    
    <script>
        function createSpeedoISPU(id, title) {
            return `
            <div class="speedo-card" id="card-${id}">
                <div class="speedo-title">${title}</div>
                <div class="speedo-container">
                    <svg viewBox="0 0 240 140" class="speedo-svg">
                        <defs><circle id="b-${id}" cx="120" cy="120" r="75" fill="none" stroke-width="16" /></defs>
                        <use href="#b-${id}" stroke="#22c55e" stroke-dasharray="47 470" transform="rotate(180 120 120)" />
                        <use href="#b-${id}" stroke="#3b82f6" stroke-dasharray="47 470" transform="rotate(216 120 120)" />
                        <use href="#b-${id}" stroke="#f59e0b" stroke-dasharray="47 470" transform="rotate(252 120 120)" />
                        <use href="#b-${id}" stroke="#ef4444" stroke-dasharray="47 470" transform="rotate(288 120 120)" />
                        <use href="#b-${id}" stroke="#000000" stroke-dasharray="47 470" transform="rotate(324 120 120)" />
                        <use href="#b-${id}" stroke="#cbd5e1" stroke-dasharray="2 7.4" transform="rotate(180 120 120)" />
                        <text x="35" y="118" font-size="11" fill="#475569" font-weight="bold" text-anchor="middle">0</text>
                        <text x="50" y="75" font-size="11" fill="#475569" font-weight="bold" text-anchor="middle">50</text>
                        <text x="85" y="48" font-size="11" fill="#475569" font-weight="bold" text-anchor="middle">100</text>
                        <text x="120" y="36" font-size="11" fill="#475569" font-weight="bold" text-anchor="middle">200</text>
                        <text x="155" y="48" font-size="11" fill="#475569" font-weight="bold" text-anchor="middle">300</text>
                        <text x="190" y="75" font-size="11" fill="#475569" font-weight="bold" text-anchor="middle">400</text>
                        <text x="205" y="118" font-size="11" fill="#475569" font-weight="bold" text-anchor="middle">500</text>
                        <g id="needle-${id}" class="speedo-needle"><polygon points="115,120 125,120 120,35" fill="#0f172a" /></g>
                    </svg>
                    <div class="speedo-val-wrap"><div id="val-${id}" class="speedo-val">--</div><div id="stat-${id}" class="speedo-stat" style="color:#475569;">MEMUAT...</div></div>
                </div>
            </div>`;
        }

        document.getElementById('grid-recv').innerHTML = 
            createSpeedoISPU('no2-recv','NO2 Receiver') + createSpeedoISPU('co-recv','CO Receiver') + 
            createSpeedoISPU('pm25-recv','PM 2.5 Receiver') + createSpeedoISPU('pm10-recv','PM 10 Receiver');
            
        document.getElementById('grid-send').innerHTML = 
            createSpeedoISPU('no2-send','NO2 Sender') + createSpeedoISPU('co-send','CO Sender') + 
            createSpeedoISPU('pm25-send','PM 2.5 Sender') + createSpeedoISPU('pm10-send','PM 10 Sender');
    </script>
    <script src="assets/js/app.js"></script>
</body>
</html>
