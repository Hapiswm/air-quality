<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Nano Banana V2 - Speedometer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Menggunakan style CSS base yang sama dengan index.html */
        :root { --bg: #1a1e29; --card: #232936; --txt: #e0e6ed; --shadow-light: rgba(255,255,255,0.05); --shadow-dark: rgba(0,0,0,0.5); }
        body { background: var(--bg); color: var(--txt); font-family: sans-serif; padding: 20px; margin: 0; }
        .navbar { display: flex; justify-content: space-between; padding: 15px 30px; background: var(--card); border-radius: 15px; box-shadow: 10px 10px 20px var(--shadow-dark), -5px -5px 15px var(--shadow-light); margin-bottom: 30px; }
        .nav-links a { color: var(--txt); text-decoration: none; padding: 10px 20px; border-radius: 10px; box-shadow: 5px 5px 10px var(--shadow-dark), -2px -2px 5px var(--shadow-light); margin-left: 10px; }
        .nav-links a.active { color: #3b82f6; box-shadow: inset 3px 3px 7px var(--shadow-dark); }
        
        .gauge-container { display: flex; justify-content: center; gap: 40px; margin-bottom: 40px; }
        .gauge-card { background: var(--card); padding: 20px; border-radius: 20px; text-align: center; box-shadow: 10px 10px 20px var(--shadow-dark), -5px -5px 15px var(--shadow-light); width: 250px; }
        .g-title { color: #94a3b8; font-size: 14px; font-weight: bold; margin-bottom: 10px; }
        .g-value { font-size: 30px; font-weight: bold; margin-top: 10px; color: #3b82f6; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div style="color:#f59e0b; font-size:24px; font-weight:bold;"><i class="fas fa-leaf"></i> NANO BANANA V2</div>
        <div class="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="speedometer.html" class="active">Speedometer</a>
            <a href="history.html">History</a>
        </div>
    </nav>

    <div class="gauge-container">
        <div class="gauge-card">
            <div class="g-title"><i class="fas fa-temperature-high"></i> Suhu (°C)</div>
            <div class="g-value" id="spd-suhu">0.0</div>
        </div>
        <div class="gauge-card">
            <div class="g-title"><i class="fas fa-tint"></i> Kelembaban (%)</div>
            <div class="g-value" id="spd-hum">0.0</div>
        </div>
    </div>

    <div class="gauge-container">
        <div class="gauge-card"><div class="g-title">NO2 (µg/m³)</div><div class="g-value" id="spd-no2">0</div><div id="ispu-spd-no2" style="margin-top:5px;font-weight:bold;">-</div></div>
        <div class="gauge-card"><div class="g-title">CO (µg/m³)</div><div class="g-value" id="spd-co">0</div><div id="ispu-spd-co" style="margin-top:5px;font-weight:bold;">-</div></div>
        <div class="gauge-card"><div class="g-title">PM 2.5 (µg/m³)</div><div class="g-value" id="spd-pm25">0</div><div id="ispu-spd-pm25" style="margin-top:5px;font-weight:bold;">-</div></div>
        <div class="gauge-card"><div class="g-title">PM 10 (µg/m³)</div><div class="g-value" id="spd-pm10">0</div><div id="ispu-spd-pm10" style="margin-top:5px;font-weight:bold;">-</div></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="app.js"></script>
</body>
</html>
