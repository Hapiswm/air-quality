<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Nano Banana V2 - Speedometer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #f0f4f8; --card: #ffffff; --txt: #1e293b; --txt-muted: #64748b; --shadow-light: rgba(255,255,255,1); --shadow-dark: rgba(148,163,184,0.2); }
        body { background: var(--bg); color: var(--txt); font-family: sans-serif; padding: 20px; margin: 0; }
        .navbar { display: flex; justify-content: space-between; padding: 15px 30px; background: var(--card); border-radius: 15px; box-shadow: 5px 5px 15px var(--shadow-dark); margin-bottom: 30px; align-items: center;}
        .nav-brand { color: #2563eb; font-size: 24px; font-weight: bold; }
        .nav-links a { color: var(--txt-muted); text-decoration: none; padding: 10px 20px; border-radius: 10px; font-weight: 600; margin-left: 10px; }
        .nav-links a.active { color: #ffffff; background: #2563eb; }
        .section-header { margin-top: 30px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;}
        
        .gauge-container { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; flex-wrap: wrap;}
        .gauge-card { background: var(--card); padding: 20px; border-radius: 20px; text-align: center; box-shadow: 5px 5px 15px var(--shadow-dark); width: 220px; }
        .g-title { color: var(--txt-muted); font-size: 14px; font-weight: bold; margin-bottom: 10px; }
        .g-value { font-size: 30px; font-weight: bold; margin-top: 10px; color: #2563eb; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand"><i class="fas fa-leaf"></i> AIR QUALITY V2</div>
        <div class="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="speedometer.html" class="active">Speedometer</a>
            <a href="history.html">History</a>
        </div>
    </nav>

    <div class="section-header"><h3>Node Receiver</h3></div>
    <div class="gauge-container">
        <div class="gauge-card"><div class="g-title">Suhu (°C)</div><div class="g-value" id="spd-suhu-in">0.0</div></div>
        <div class="gauge-card"><div class="g-title">NO2 (µg/m³)</div><div class="g-value" id="spd-no2-in">0</div><div id="ispu-spd-no2-in" style="font-weight:bold; margin-top:5px;">-</div></div>
        <div class="gauge-card"><div class="g-title">CO (µg/m³)</div><div class="g-value" id="spd-co-in">0</div><div id="ispu-spd-co-in" style="font-weight:bold; margin-top:5px;">-</div></div>
        <div class="gauge-card"><div class="g-title">PM 2.5 (µg/m³)</div><div class="g-value" id="spd-pm25-in">0</div><div id="ispu-spd-pm25-in" style="font-weight:bold; margin-top:5px;">-</div></div>
        <div class="gauge-card"><div class="g-title">PM 10 (µg/m³)</div><div class="g-value" id="spd-pm10-in">0</div><div id="ispu-spd-pm10-in" style="font-weight:bold; margin-top:5px;">-</div></div>
    </div>

    <div class="section-header"><h3>Node Sender</h3></div>
    <div class="gauge-container">
        <div class="gauge-card"><div class="g-title">Suhu (°C)</div><div class="g-value" id="spd-suhu-out">0.0</div></div>
        <div class="gauge-card"><div class="g-title">NO2 (µg/m³)</div><div class="g-value" id="spd-no2-out">0</div><div id="ispu-spd-no2-out" style="font-weight:bold; margin-top:5px;">-</div></div>
        <div class="gauge-card"><div class="g-title">CO (µg/m³)</div><div class="g-value" id="spd-co-out">0</div><div id="ispu-spd-co-out" style="font-weight:bold; margin-top:5px;">-</div></div>
        <div class="gauge-card"><div class="g-title">PM 2.5 (µg/m³)</div><div class="g-value" id="spd-pm25-out">0</div><div id="ispu-spd-pm25-out" style="font-weight:bold; margin-top:5px;">-</div></div>
        <div class="gauge-card"><div class="g-title">PM 10 (µg/m³)</div><div class="g-value" id="spd-pm10-out">0</div><div id="ispu-spd-pm10-out" style="font-weight:bold; margin-top:5px;">-</div></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="app.js"></script>
</body>
</html>
