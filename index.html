<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nano Banana V2 - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #1a1e29; --card: #232936; --txt: #e0e6ed;
            --shadow-light: rgba(255,255,255,0.05); --shadow-dark: rgba(0,0,0,0.5);
        }
        body { background: var(--bg); color: var(--txt); font-family: 'Segoe UI', sans-serif; padding: 20px; margin: 0; }
        
        /* Navbar */
        .navbar { display: flex; justify-content: space-between; padding: 15px 30px; background: var(--card); border-radius: 15px; box-shadow: 10px 10px 20px var(--shadow-dark), -5px -5px 15px var(--shadow-light); margin-bottom: 30px; }
        .nav-links a { color: var(--txt); text-decoration: none; padding: 10px 20px; border-radius: 10px; box-shadow: 5px 5px 10px var(--shadow-dark), -2px -2px 5px var(--shadow-light); margin-left: 10px; }
        .nav-links a.active { color: #3b82f6; box-shadow: inset 3px 3px 7px var(--shadow-dark); }
        
        /* Weather Panel */
        .weather-panel { display: flex; justify-content: center; gap: 30px; margin-bottom: 30px; }
        .w-card { background: var(--card); padding: 15px 40px; border-radius: 20px; text-align: center; box-shadow: 10px 10px 20px var(--shadow-dark), -5px -5px 15px var(--shadow-light); }
        .w-val { font-size: 28px; font-weight: bold; color: #60a5fa; margin: 10px 0; }
        .w-label { font-size: 12px; color: #94a3b8; text-transform: uppercase; }

        /* Grid Sensor */
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; }
        .card { background: var(--card); padding: 20px; border-radius: 20px; text-align: center; box-shadow: 15px 15px 30px var(--shadow-dark), -5px -5px 15px var(--shadow-light); border-top: 4px solid #333; transition: all 0.3s; }
        .c-title { color: #94a3b8; font-size: 13px; font-weight: bold; margin-bottom: 15px; }
        .c-val { font-size: 24px; font-weight: bold; }
        .c-unit { font-size: 14px; color: #64748b; }
        .c-emoji { font-size: 40px; display: block; margin: 15px 0; }
        .c-status { font-weight: bold; letter-spacing: 1px; font-size: 14px; }
        
        .header-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div style="color:#f59e0b; font-size:24px; font-weight:bold;"><i class="fas fa-leaf"></i> NANO BANANA V2</div>
        <div class="nav-links">
            <a href="index.html" class="active">Dashboard</a>
            <a href="speedometer.html">Speedometer</a>
            <a href="history.html">History</a>
        </div>
    </nav>

    <div class="weather-panel">
        <div class="w-card"><div class="w-label"><i class="fas fa-thermometer-half"></i> Suhu Ruangan</div><div class="w-val" id="val-suhu">-- °C</div></div>
        <div class="w-card"><div class="w-label"><i class="fas fa-tint"></i> Kelembaban</div><div class="w-val" id="val-hum">-- %</div></div>
    </div>

    <div class="header-title">
        <h2><i class="fas fa-microchip"></i> Pemantauan Kualitas Udara (Indoor)</h2>
        <div style="color:#22c55e;"><i class="fas fa-wifi"></i> LIVE</div>
    </div>

    <div class="grid">
        <div class="card" id="card-no2"><div class="c-title">NO2 (MiCS-6814)</div><div class="c-val"><span id="val-no2">0</span> <span class="c-unit">µg/m³</span></div><span class="c-emoji" id="emo-no2">⏳</span><div class="c-status" id="stat-no2">LOADING</div></div>
        <div class="card" id="card-co"><div class="c-title">CO (MiCS-6814)</div><div class="c-val"><span id="val-co">0</span> <span class="c-unit">µg/m³</span></div><span class="c-emoji" id="emo-co">⏳</span><div class="c-status" id="stat-co">LOADING</div></div>
        <div class="card" id="card-pm25"><div class="c-title">PM 2.5 (PMS5003)</div><div class="c-val"><span id="val-pm25">0</span> <span class="c-unit">µg/m³</span></div><span class="c-emoji" id="emo-pm25">⏳</span><div class="c-status" id="stat-pm25">LOADING</div></div>
        <div class="card" id="card-pm10"><div class="c-title">PM 10 (PMS5003)</div><div class="c-val"><span id="val-pm10">0</span> <span class="c-unit">µg/m³</span></div><span class="c-emoji" id="emo-pm10">⏳</span><div class="c-status" id="stat-pm10">LOADING</div></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="app.js"></script>
</body>
</html>
